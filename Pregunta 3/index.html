<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pregunta 3 | Paisaje animado</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <h1>Un día tranquilo</h1>
    <p>Un pequeño paisaje animado con CSS.</p>

    <div class="paisaje" role="img" aria-label="Un sol sube y baja mientras una nube se mueve sobre colinas verdes">
      <div class="sol" aria-hidden="true"></div>
      <div class="nube" aria-hidden="true"></div>
      <div class="colina colina-fondo" aria-hidden="true"></div>
      <div class="colina colina-frente" aria-hidden="true"></div>
    </div>
  </main>
</body>
</html>
